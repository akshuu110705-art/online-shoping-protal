{% extends 'store/admin/base.html' %}
{% block content %}

<div class="admin-header">
    <h2>{{ action }} Product</h2>
    <a href="/dashboard/products/" class="btn btn-outline">← Back</a>
</div>

<div class="admin-form-box">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Product Name</label>
        <input type="text" name="name" value="{{ product.name }}" required>

        <label>Category</label>
        <input type="text" name="category" value="{{ product.category }}" required>

        <label>Price ($)</label>
        <input type="number" name="price" step="0.01" value="{{ product.price }}" required>

        <label>Stock</label>
        <input type="number" name="stock" value="{{ product.stock }}" required>

        <label>Description</label>
        <textarea name="description" rows="4" required>{{ product.description }}</textarea>

        <label>Product Image</label>
        <input type="file" name="image" accept="image/*">
        {% if product.image %}
        <div style="margin-top:8px;">
            <img src="{{ product.image.url }}" style="width:100px;height:100px;object-fit:cover;border-radius:8px;">
            <p style="font-size:12px;color:#888;">Current image. Upload new to replace.</p>
        </div>
        {% endif %}

        <button type="submit" class="btn">{{ action }} Product</button>
    </form>
</div>

{% endblock %}
